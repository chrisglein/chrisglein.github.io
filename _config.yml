# Setup
title:            Chris Glein
tagline:          'Game Design and Life'
description:      'Game design, and musings on life in general'
baseurl:          /
url:              https://chrisglein.com
paginate:         5

excerpt_separator:  <!--more-->

related_by: tags or categories  # Match on just tags
related_limit: 5                # Include 6 related pages
related_categories: 0           # Match at least 1 category
related_tags: 1                 # Match at least 1 tag.

# About/contact
author:
  name:           'Chris Glein'
  url:            https://chrisglein.com

# Gems
plugins:
  - jekyll-paginate

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "_posts"
    values:
      layout: "post"
      author: "Chris Glein"
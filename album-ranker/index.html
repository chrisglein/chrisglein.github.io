---
title: Album Ranker
description: Pick the album you prefer in each matchup. Albums land in tiers by wins.
layout: page
---
<style>
#album-ranker {
  --ar-bg: #1a1a1d;
  --ar-panel: #25252a;
  --ar-text: #f1f1f1;
  --ar-muted: #9a9aa0;
  --ar-accent: #e8b923;
  --ar-hover: #2f2f36;

  background: var(--ar-bg);
  color: var(--ar-text);
  line-height: 1.5;
  padding: 1.5rem 1rem 2rem;
  border-radius: 12px;
  margin: 1rem 0;
}

#album-ranker *, #album-ranker *::before, #album-ranker *::after {
  box-sizing: border-box;
}

#album-ranker .ar-header {
  max-width: 900px;
  margin: 0 auto 2rem;
  text-align: center;
}

#album-ranker .ar-header h2 { margin: 0 0 0.25rem; font-size: 2rem; color: var(--ar-text); }
#album-ranker .subtitle { color: var(--ar-muted); margin: 0; }

#album-ranker .ar-main {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

#album-ranker section {
  background: var(--ar-panel);
  border-radius: 12px;
  padding: 1.5rem;
}

#album-ranker h2 { margin: 0 0 1rem; font-size: 1.25rem; color: var(--ar-text); }
#album-ranker h3 { margin: 1rem 0 0.5rem; font-size: 1rem; color: var(--ar-accent); }
#album-ranker .hint { color: var(--ar-muted); font-weight: normal; font-size: 0.85rem; }

#album-ranker #progress-bar {
  display: flex;
  gap: 4px;
  margin-top: 0.5rem;
}
#album-ranker .progress-segment {
  flex: 1;
  height: 28px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
#album-ranker .segment-fill {
  height: 100%;
  width: 0%;
  background: var(--ar-accent);
  opacity: 0.5;
  transition: width 0.2s ease;
}
#album-ranker .progress-segment.completed .segment-fill { opacity: 1; }
#album-ranker .progress-segment.active {
  outline: 2px solid var(--ar-accent);
  outline-offset: 1px;
}
#album-ranker .segment-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--ar-muted);
  pointer-events: none;
}
#album-ranker .progress-segment.completed .segment-label,
#album-ranker .progress-segment.active .segment-label { color: var(--ar-text); }
#album-ranker #progress-text { font-size: 0.9rem; color: var(--ar-muted); }

#album-ranker #matchup {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
}

#album-ranker .album-card {
  background: #2f2f36;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 1.5rem;
  color: var(--ar-text);
  text-align: left;
  cursor: pointer;
  font: inherit;
  transition: all 0.15s ease;
  min-height: 130px;
  display: flex;
  gap: 1rem;
  align-items: center;
}
#album-ranker .card-art {
  width: 100px;
  height: 100px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
#album-ranker .card-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  line-height: 1.1;
}
#album-ranker .album-card:hover {
  background: var(--ar-hover);
  border-color: var(--ar-accent);
  transform: translateY(-2px);
}
#album-ranker .album-card .title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 0.1rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#album-ranker .album-card .artist { color: var(--ar-text); }
#album-ranker .album-card .year { color: var(--ar-muted); font-size: 0.9rem; }

#album-ranker .vs { font-weight: bold; color: var(--ar-accent); font-size: 1.25rem; }

#album-ranker #standings, #album-ranker #final-tiers {
  max-height: 400px;
  overflow-y: auto;
}
#album-ranker .tier-group { margin-bottom: 1rem; }
#album-ranker .tier-group:last-child { margin-bottom: 0; }
#album-ranker .tier-label {
  font-weight: 600;
  color: var(--ar-accent);
  margin-bottom: 0.25rem;
}
#album-ranker .tier-group ul, #album-ranker .tier-group ol {
  margin: 0.25rem 0 0;
  padding-left: 1.5rem;
}
#album-ranker .tier-group li {
  padding: 0.2rem 0;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
#album-ranker .list-art {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
}
#album-ranker .tier-group li:last-child { border-bottom: none; }

#album-ranker textarea {
  width: 100%;
  background: #1a1a1d;
  color: var(--ar-text);
  border: 1px solid #444;
  border-radius: 6px;
  padding: 0.75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.85rem;
  resize: vertical;
}

#album-ranker button#copy-json, #album-ranker button#restart {
  margin-top: 0.75rem;
  margin-right: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--ar-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}
#album-ranker button#copy-json:hover, #album-ranker button#restart:hover { filter: brightness(1.1); }

#album-ranker .hidden { display: none; }

#album-ranker .setting-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1rem 0;
}
#album-ranker .setting-row label { font-weight: 600; color: var(--ar-text); }
#album-ranker .setting-row input[type="range"] { flex: 1; accent-color: var(--ar-accent); }
#album-ranker #round-display { font-weight: 600; font-size: 1.1rem; min-width: 2ch; text-align: center; }

#album-ranker #start-btn {
  padding: 0.75rem 2rem;
  background: var(--ar-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
#album-ranker #start-btn:hover { filter: brightness(1.1); }
#album-ranker #start-btn:disabled { opacity: 0.4; cursor: default; }

@media (max-width: 600px) {
  #album-ranker #matchup { grid-template-columns: 1fr; }
  #album-ranker .vs { text-align: center; }
}
</style>

<div id="album-ranker">
  <div class="ar-main">
    <section id="setup-section">
      <h2>Setup</h2>
      <p><span id="album-count">0</span> albums loaded</p>
      <div class="setting-row">
        <label for="round-slider">Rounds</label>
        <input type="range" id="round-slider" min="2" max="8" value="5" />
        <span id="round-display">5</span>
      </div>
      <p id="comparison-estimate" class="hint"></p>
      <button id="start-btn">Start Ranking</button>
    </section>

    <section id="progress-section" class="hidden">
      <div id="progress-text"></div>
      <div id="progress-bar"></div>
    </section>

    <section id="matchup-section" class="hidden">
      <h2>Which do you prefer?</h2>
      <p id="round-info" class="hint"></p>
      <div id="matchup">
        <button class="album-card" id="card-a"></button>
        <div class="vs">vs</div>
        <button class="album-card" id="card-b"></button>
      </div>
    </section>

    <section id="standings-section" class="hidden">
      <h2>Current Standings</h2>
      <div id="standings"></div>
    </section>

    <section id="results-section" class="hidden">
      <h2>Final Ranking</h2>
      <div id="final-tiers"></div>
      <h3>JSON Output</h3>
      <textarea id="json-output" readonly rows="14"></textarea>
      <button id="copy-json">Copy JSON</button>
      <button id="restart">Start Over</button>
    </section>
  </div>
</div>

<script src="{{ '/album-ranker/albums.js' | relative_url }}"></script>
<script src="{{ '/album-ranker/album-art-cache.js' | relative_url }}" onerror="window.ALBUM_ART={}"></script>
<script src="{{ '/album-ranker/script.js' | relative_url }}"></script>

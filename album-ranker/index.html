---
title: Album Ranker
description: Pick the album you prefer in each matchup. Albums land in tiers by wins.
layout: bracket-ranker
---
<script>
  // Unique config for this ranker. The shared engine reads window.BRACKET.
  window.BRACKET = {
    noun: "album",
    nounPlural: "albums",
    prompt: "Which do you prefer?",
    accent: "#aa759f",
    recommendedRounds: 4,
    maxRounds: 8,
    cardLines: function (item) {
      return [
        { text: item.artist, className: "sub" },
        { text: item.year, className: "meta" },
      ];
    },
    link: function () { return null; },
    listLine: function (item) {
      return item.artist + (item.year ? " (" + item.year + ")" : "");
    },
    jsonFields: ["artist", "year"],
  };
</script>
<script src="{{ '/album-ranker/albums.js' | relative_url }}"></script>
<script src="{{ '/album-ranker/album-art-cache.js' | relative_url }}" onerror="window.ART={}"></script>

---
title: Movie Ranker
description: Pick the movie you like more in each matchup. Movies land in tiers by wins.
layout: page
---
<style>
#movie-ranker {
  --mr-bg: #1a1a1d;
  --mr-panel: #25252a;
  --mr-text: #f1f1f1;
  --mr-muted: #9a9aa0;
  --mr-accent: #e8b923;
  --mr-hover: #2f2f36;

  background: var(--mr-bg);
  color: var(--mr-text);
  line-height: 1.5;
  padding: 1.5rem 1rem 2rem;
  border-radius: 12px;
  margin: 1rem 0;
}

#movie-ranker *, #movie-ranker *::before, #movie-ranker *::after {
  box-sizing: border-box;
}

#movie-ranker strong { color: var(--mr-text); }

#movie-ranker .mr-main {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

#movie-ranker section {
  background: var(--mr-panel);
  border-radius: 12px;
  padding: 1.5rem;
}

#movie-ranker h2 { margin: 0 0 1rem; font-size: 1.25rem; color: var(--mr-text); }
#movie-ranker h3 { margin: 1rem 0 0.5rem; font-size: 1rem; color: var(--mr-accent); }
#movie-ranker .hint { color: var(--mr-muted); font-weight: normal; font-size: 0.85rem; }

#movie-ranker #progress-bar {
  display: flex;
  gap: 4px;
  margin-top: 0.5rem;
}
#movie-ranker .progress-segment {
  flex: 1;
  height: 28px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
#movie-ranker .segment-fill {
  height: 100%;
  width: 0%;
  background: var(--mr-accent);
  opacity: 0.5;
  transition: width 0.2s ease;
}
#movie-ranker .progress-segment.completed .segment-fill { opacity: 1; }
#movie-ranker .progress-segment.active {
  outline: 2px solid var(--mr-accent);
  outline-offset: 1px;
}
#movie-ranker .segment-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--mr-muted);
  pointer-events: none;
}
#movie-ranker .progress-segment.completed .segment-label,
#movie-ranker .progress-segment.active .segment-label { color: var(--mr-text); }
#movie-ranker #progress-text { font-size: 0.9rem; color: var(--mr-muted); }

#movie-ranker #matchup {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
}

#movie-ranker .card {
  background: #2f2f36;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.75rem;
  color: var(--mr-text);
  text-align: left;
  cursor: pointer;
  font: inherit;
  transition: all 0.15s ease;
  min-height: 130px;
  display: flex;
  gap: 0.75rem;
  align-items: center;
  position: relative;
}
#movie-ranker .card--link .card-text { padding-bottom: 1.6rem; }
#movie-ranker .card-art {
  width: 74px;
  height: 110px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  margin: initial;
}
#movie-ranker .card-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  line-height: 1.15;
}
@media (hover: hover) and (pointer: fine) {
  #movie-ranker .card:hover {
    background: var(--mr-hover);
    border-color: var(--mr-accent);
    transform: translateY(-2px);
  }
}
#movie-ranker .card:focus-visible {
  outline: none;
  border-color: var(--mr-accent);
}
#movie-ranker .card .title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 0.1rem;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#movie-ranker .card .meta { color: var(--mr-muted); font-size: 0.85rem; }

#movie-ranker .ext-link {
  position: absolute;
  right: 0.5rem;
  bottom: 0.5rem;
  font-size: 0.7rem;
  color: var(--mr-accent);
  text-decoration: none;
  border: 1px solid rgba(232, 185, 35, 0.45);
  border-radius: 999px;
  padding: 0.2rem 0.5rem;
  line-height: 1.2;
}
#movie-ranker .ext-link:hover,
#movie-ranker .ext-link:focus-visible {
  background: rgba(232, 185, 35, 0.15);
  border-color: var(--mr-accent);
  outline: none;
}

#movie-ranker .vs { font-weight: bold; color: var(--mr-accent); font-size: 1.25rem; }

#movie-ranker #standings, #movie-ranker #final-tiers {
  max-height: 400px;
  overflow-y: auto;
}
#movie-ranker .tier-group { margin-bottom: 1rem; }
#movie-ranker .tier-group:last-child { margin-bottom: 0; }
#movie-ranker .tier-label {
  font-weight: 600;
  color: var(--mr-accent);
  margin-bottom: 0.25rem;
}
#movie-ranker .tier-group ul, #movie-ranker .tier-group ol {
  margin: 0.25rem 0 0;
  padding-left: 1.5rem;
}
#movie-ranker .tier-group li {
  padding: 0.2rem 0;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
#movie-ranker .list-art {
  width: 26px;
  height: 39px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  margin: initial;
}
#movie-ranker .tier-group li:last-child { border-bottom: none; }
#movie-ranker .tier-group h3 {
  color: var(--mr-accent);
  margin: 0 0 0.25rem;
  font-size: 1rem;
}

#movie-ranker textarea {
  width: 100%;
  background: #1a1a1d;
  color: var(--mr-text);
  border: 1px solid #444;
  border-radius: 6px;
  padding: 0.75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.85rem;
  resize: vertical;
}

#movie-ranker button#copy-json, #movie-ranker button#restart {
  margin-top: 0.75rem;
  margin-right: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--mr-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}
#movie-ranker button#copy-json:hover, #movie-ranker button#restart:hover { filter: brightness(1.1); }

#movie-ranker .hidden { display: none; }

#movie-ranker .setting-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1rem 0;
}
#movie-ranker .setting-row label { font-weight: 600; color: var(--mr-text); }
#movie-ranker .setting-row input[type="range"] { flex: 1; accent-color: var(--mr-accent); }
#movie-ranker #round-display { font-weight: 600; font-size: 1.1rem; min-width: 2ch; text-align: center; }

#movie-ranker #start-btn {
  padding: 0.75rem 2rem;
  background: var(--mr-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
#movie-ranker #start-btn:hover { filter: brightness(1.1); }
#movie-ranker #start-btn:disabled { opacity: 0.4; cursor: default; }

@media (max-width: 600px) {
  #movie-ranker #matchup { grid-template-columns: 1fr; }
  #movie-ranker .vs { text-align: center; }
}
</style>

<div id="movie-ranker">
  <div class="mr-main">
    <section id="setup-section">
      <h2>Setup</h2>
      <p><span id="item-count">0</span> <span id="item-noun">movies</span> loaded</p>
      <div class="setting-row">
        <label for="round-slider">Rounds</label>
        <input type="range" id="round-slider" min="2" max="8" value="6" />
        <span id="round-display">6</span>
      </div>
      <p id="comparison-estimate" class="hint"></p>
      <button id="start-btn">Start Ranking</button>
    </section>

    <section id="progress-section" class="hidden">
      <div id="progress-text"></div>
      <div id="progress-bar"></div>
    </section>

    <section id="matchup-section" class="hidden">
      <h2 id="matchup-prompt">Which do you like more?</h2>
      <p id="round-info" class="hint"></p>
      <div id="matchup">
        <div class="card" id="card-a" role="button" tabindex="0" aria-label="Choose movie A"></div>
        <div class="vs">vs</div>
        <div class="card" id="card-b" role="button" tabindex="0" aria-label="Choose movie B"></div>
      </div>
    </section>

    <section id="standings-section" class="hidden">
      <h2>Current Standings</h2>
      <div id="standings"></div>
    </section>

    <section id="results-section" class="hidden">
      <h2>Final Ranking</h2>
      <div id="final-tiers"></div>
      <h3>JSON Output</h3>
      <textarea id="json-output" readonly rows="14"></textarea>
      <button id="copy-json">Copy JSON</button>
      <button id="restart">Start Over</button>
    </section>
  </div>
</div>

<script>
  // Config for this ranker. The engine (script.js) reads window.BRACKET.
  window.BRACKET = {
    noun: "movie",
    nounPlural: "movies",
    prompt: "Which do you like more?",
    defaultRounds: 6,
    maxRounds: 8,
    cardLines: function () { return []; },
    link: function (item) {
      return item.imdb ? { href: item.imdb, label: "IMDb", site: "IMDb" } : null;
    },
    listLine: function () { return ""; },
    jsonFields: ["imdb"],
  };
</script>
<script src="{{ '/movie-ranker/movies.js' | relative_url }}"></script>
<script src="{{ '/movie-ranker/movie-art-cache.js' | relative_url }}" onerror="window.ART={}"></script>
<script src="{{ '/movie-ranker/script.js' | relative_url }}"></script>

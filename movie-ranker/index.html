---
title: Movie Ranker
description: Pick the movie you like more in each matchup. Movies land in tiers by wins.
layout: bracket-ranker
posters: true
---
<script>
  // Unique config for this ranker. The shared engine reads window.BRACKET.
  window.BRACKET = {
    noun: "movie",
    nounPlural: "movies",
    prompt: "Which do you like more?",
    recommendedRounds: 4,
    maxRounds: 8,
    cardLines: function () { return []; },
    link: function (item) {
      return item.imdb ? { href: item.imdb, label: "IMDb", site: "IMDb" } : null;
    },
    listLine: function () { return ""; },
    jsonFields: ["imdb"],
  };
</script>
<script src="{{ '/movie-ranker/movies.js' | relative_url }}"></script>
<script src="{{ '/movie-ranker/movie-art-cache.js' | relative_url }}" onerror="window.ART={}"></script>

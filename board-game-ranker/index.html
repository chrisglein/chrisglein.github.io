---
title: Board Game Ranker
description: Pick the game you'd rather play in each matchup. Games land in tiers by wins.
layout: page
---
<style>
#board-game-ranker {
  --bgr-bg: #1a1a1d;
  --bgr-panel: #25252a;
  --bgr-text: #f1f1f1;
  --bgr-muted: #9a9aa0;
  --bgr-accent: #e8b923;
  --bgr-hover: #2f2f36;

  background: var(--bgr-bg);
  color: var(--bgr-text);
  line-height: 1.5;
  padding: 1.5rem 1rem 2rem;
  border-radius: 12px;
  margin: 1rem 0;
}

#board-game-ranker *, #board-game-ranker *::before, #board-game-ranker *::after {
  box-sizing: border-box;
}

#board-game-ranker strong {
  color: var(--bgr-text);
}

#board-game-ranker .bgr-header {
  max-width: 900px;
  margin: 0 auto 2rem;
  text-align: center;
}

#board-game-ranker .bgr-header h2 {
  margin: 0 0 0.25rem;
  font-size: 2rem;
  color: var(--bgr-text);
}

#board-game-ranker .subtitle {
  color: var(--bgr-muted);
  margin: 0;
}

#board-game-ranker .bgr-main {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

#board-game-ranker section {
  background: var(--bgr-panel);
  border-radius: 12px;
  padding: 1.5rem;
}

#board-game-ranker h2 {
  margin: 0 0 1rem;
  font-size: 1.25rem;
  color: var(--bgr-text);
}

#board-game-ranker h3 {
  margin: 1rem 0 0.5rem;
  font-size: 1rem;
  color: var(--bgr-accent);
}

#board-game-ranker .hint {
  color: var(--bgr-muted);
  font-weight: normal;
  font-size: 0.85rem;
}

#board-game-ranker #progress-bar {
  display: flex;
  gap: 4px;
  margin-top: 0.5rem;
}

#board-game-ranker .progress-segment {
  flex: 1;
  height: 28px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

#board-game-ranker .segment-fill {
  height: 100%;
  width: 0%;
  background: var(--bgr-accent);
  opacity: 0.5;
  transition: width 0.2s ease;
}

#board-game-ranker .progress-segment.completed .segment-fill {
  opacity: 1;
}

#board-game-ranker .progress-segment.active {
  outline: 2px solid var(--bgr-accent);
  outline-offset: 1px;
}

#board-game-ranker .segment-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--bgr-muted);
  pointer-events: none;
}

#board-game-ranker .progress-segment.completed .segment-label,
#board-game-ranker .progress-segment.active .segment-label {
  color: var(--bgr-text);
}

#board-game-ranker #progress-text {
  font-size: 0.9rem;
  color: var(--bgr-muted);
}

#board-game-ranker #matchup {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
}

#board-game-ranker .game-card {
  background: #2f2f36;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 0.5rem;
  color: var(--bgr-text);
  text-align: left;
  cursor: pointer;
  font: inherit;
  transition: all 0.15s ease;
  min-height: 130px;
  display: flex;
  gap: 0.5rem;
  align-items: center;
  position: relative;
}

#board-game-ranker .card-art {
  width: 100px;
  height: 100px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  margin: initial;
}

#board-game-ranker .card-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  line-height: 1.1;
  padding-bottom: 1.6rem;
}

#board-game-ranker .game-card:hover {
  background: var(--bgr-hover);
  border-color: var(--bgr-accent);
  transform: translateY(-2px);
}

#board-game-ranker .game-card .title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.1rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

#board-game-ranker .game-card .meta {
  color: var(--bgr-muted);
  font-size: 0.8rem;
}

#board-game-ranker .bgg-link {
  position: absolute;
  right: 0.5rem;
  bottom: 0.5rem;
  font-size: 0.7rem;
  color: var(--bgr-accent);
  text-decoration: none;
  border: 1px solid rgba(232, 185, 35, 0.45);
  border-radius: 999px;
  padding: 0.2rem 0.5rem;
  line-height: 1.2;
}

#board-game-ranker .bgg-link:hover,
#board-game-ranker .bgg-link:focus-visible {
  background: rgba(232, 185, 35, 0.15);
  border-color: var(--bgr-accent);
  outline: none;
}

#board-game-ranker .list-meta {
  color: var(--bgr-muted);
  font-size: 0.85rem;
}

#board-game-ranker .vs {
  font-weight: bold;
  color: var(--bgr-accent);
  font-size: 1.25rem;
}

#board-game-ranker #standings,
#board-game-ranker #final-tiers {
  max-height: 400px;
  overflow-y: auto;
}

#board-game-ranker .tier-group {
  margin-bottom: 1rem;
}

#board-game-ranker .tier-group:last-child {
  margin-bottom: 0;
}

#board-game-ranker .tier-label {
  font-weight: 600;
  color: var(--bgr-accent);
  margin-bottom: 0.25rem;
}

#board-game-ranker .tier-group ul,
#board-game-ranker .tier-group ol {
  margin: 0.25rem 0 0;
  padding-left: 1.5rem;
}

#board-game-ranker .tier-group li {
  padding: 0.2rem 0;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

#board-game-ranker .list-art {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
}

#board-game-ranker .tier-group li:last-child {
  border-bottom: none;
}

#board-game-ranker .tier-group h3 {
  color: var(--bgr-accent);
  margin: 0 0 0.25rem;
  font-size: 1rem;
}

#board-game-ranker textarea {
  width: 100%;
  background: #1a1a1d;
  color: var(--bgr-text);
  border: 1px solid #444;
  border-radius: 6px;
  padding: 0.75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.85rem;
  resize: vertical;
}

#board-game-ranker button#copy-json,
#board-game-ranker button#restart {
  margin-top: 0.75rem;
  margin-right: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--bgr-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}

#board-game-ranker button#copy-json:hover,
#board-game-ranker button#restart:hover {
  filter: brightness(1.1);
}

#board-game-ranker .hidden {
  display: none;
}

#board-game-ranker .setting-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1rem 0;
}

#board-game-ranker .setting-row label {
  font-weight: 600;
}

#board-game-ranker .setting-row input[type="range"] {
  flex: 1;
  accent-color: var(--bgr-accent);
}

#board-game-ranker #round-display {
  font-weight: 600;
  font-size: 1.1rem;
  min-width: 2ch;
  text-align: center;
}

#board-game-ranker #start-btn {
  padding: 0.75rem 2rem;
  background: var(--bgr-accent);
  color: #1a1a1d;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
}

#board-game-ranker #start-btn:hover {
  filter: brightness(1.1);
}

#board-game-ranker #start-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

@media (max-width: 600px) {
  #board-game-ranker #matchup {
    grid-template-columns: 1fr;
  }

  #board-game-ranker .vs {
    text-align: center;
  }
}
</style>

<div id="board-game-ranker">
  <div class="bgr-main">
    <section id="setup-section">
      <h2>Setup</h2>
      <p><span id="game-count">0</span> games loaded</p>
      <div class="setting-row">
        <label for="round-slider">Rounds</label>
        <input type="range" id="round-slider" min="2" max="8" value="4" />
        <span id="round-display">4</span>
      </div>
      <p id="comparison-estimate" class="hint"></p>
      <button id="start-btn">Start Ranking</button>
    </section>

    <section id="progress-section" class="hidden">
      <div id="progress-text"></div>
      <div id="progress-bar"></div>
    </section>

    <section id="matchup-section" class="hidden">
      <h2>Which would you rather play?</h2>
      <p id="round-info" class="hint"></p>
      <div id="matchup">
        <div class="game-card" id="card-a" role="button" tabindex="0" aria-label="Choose game A"></div>
        <div class="vs">vs</div>
        <div class="game-card" id="card-b" role="button" tabindex="0" aria-label="Choose game B"></div>
      </div>
    </section>

    <section id="standings-section" class="hidden">
      <h2>Current Standings</h2>
      <div id="standings"></div>
    </section>

    <section id="results-section" class="hidden">
      <h2>Final Ranking</h2>
      <div id="final-tiers"></div>
      <h3>JSON Output</h3>
      <textarea id="json-output" readonly rows="14"></textarea>
      <button id="copy-json">Copy JSON</button>
      <button id="restart">Start Over</button>
    </section>
  </div>
</div>

<script src="{{ '/board-game-ranker/games.js' | relative_url }}"></script>
<script src="{{ '/board-game-ranker/game-art-cache.js' | relative_url }}" onerror="window.GAME_ART={}"></script>
<script src="{{ '/board-game-ranker/script.js' | relative_url }}"></script>

---
title: Board Game Ranker
layout: bracket-ranker
native_art: true
---
<script>
  // Unique config for this ranker. The shared engine reads window.BRACKET.
  window.BRACKET = {
    noun: "game",
    nounPlural: "games",
    prompt: "Which would you rather play?",
    accent: "#aa759f",
    intro: "Pick the game you'd rather play in each matchup. Games land in tiers by wins.",
    recommendedRounds: 4,
    maxRounds: 8,
    cardLines: function (item) {
      var parts = [];
      if (item.players) parts.push(item.players + " players");
      if (item.time != null) parts.push(item.time + " min");
      return parts.length ? [{ text: parts.join(" \u00B7 "), className: "meta" }] : [];
    },
    link: function (item) {
      var url = item.bggUrl
        ? item.bggUrl
        : (item.bggId
            ? "https://boardgamegeek.com/boardgame/" + encodeURIComponent(String(item.bggId))
            : "https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=" + encodeURIComponent(item.title));
      return { href: url, label: "BGG", site: "BoardGameGeek" };
    },
    listLine: function () { return ""; },
    jsonFields: ["players", "time"],
    storageKey: "board-games",
  };
</script>
<script src="{{ '/board-game-ranker/games.js' | relative_url }}"></script>
<script src="{{ '/board-game-ranker/game-art-cache.js' | relative_url }}" onerror="window.ART={}"></script>

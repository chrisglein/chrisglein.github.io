---
title: Board Game Ranker
layout: bracket-ranker
native_art: true
---
<script>
  // Unique config for this ranker. The shared engine reads window.BRACKET.
  window.BRACKET = {
    noun: "game",
    nounPlural: "games",
    prompt: "Which would you rather play?",
    accent: "#aa759f",
    intro: "Pick the game you'd rather play in each matchup. Games land in tiers by wins.",
    maxRounds: 8,
    cardLines: function (item) {
      var parts = [];
      if (item.players) parts.push(item.players + (item.players === "1" ? " player" : " players"));
      if (item.time != null) parts.push(item.time + " min");
      return parts.length ? [{ text: parts.join(" \u00B7 "), className: "meta" }] : [];
    },
    link: function (item) {
      var url = item.bggUrl
        ? item.bggUrl
        : (item.bggId
            ? "https://boardgamegeek.com/boardgame/" + encodeURIComponent(String(item.bggId))
            : "https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=" + encodeURIComponent(item.title));
      return { href: url, label: "BGG", site: "BoardGameGeek" };
    },
    listLine: function () { return ""; },
    jsonFields: ["players", "time"],
    storageKey: "board-games",
  };
</script>
<script src="{{ '/board-game-ranker/games-boys-night.js' | relative_url }}"></script>
<script src="{{ '/board-game-ranker/art-boys-night.js' | relative_url }}" onerror="window.ART_BOYS_NIGHT={}"></script>
<script src="{{ '/board-game-ranker/games-jess.js' | relative_url }}"></script>
<script src="{{ '/board-game-ranker/art-jess.js' | relative_url }}" onerror="window.ART_JESS={}"></script>
<script>
  // Datasets are wired after the data scripts load, since each one needs the
  // globals those files define. Each set keeps its own saved progress.
  window.BRACKET.datasets = [
    {
      id: "boys-night",
      label: "Boys Night",
      blurb: "The games that hit the table on Tuesday night.",
      items: window.ITEMS_BOYS_NIGHT || [],
      art: window.ART_BOYS_NIGHT || {},
      recommendedRounds: 4,
    },
    {
      id: "jess",
      label: "Jess",
      blurb: "Finding Jess' top board game picks.",
      items: window.ITEMS_JESS || [],
      art: window.ART_JESS || {},
    },
  ];
</script>

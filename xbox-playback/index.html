<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Choose a gamertag / Xbox Playback</title>
  <style>
    :root { color-scheme: dark; --bg: #0b100e; --text: #edf5eb; --muted: #a1b3a5; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: radial-gradient(ellipse at 20% 0%, #1a2b1c 0%, transparent 55%), var(--bg);
      color: var(--text);
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    main { width: 100%; max-width: 1040px; margin: auto; padding: 64px 28px; }
    header { margin-bottom: 32px; }
    .eyebrow { margin: 0 0 12px; color: #bbf763; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: 1.15; letter-spacing: -1.6px; }
    .intro { margin: 12px 0 0; color: var(--muted); }
    .profiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card {
      --accent: #bbf763;
      --glow: #263c1d;
      display: block;
      overflow: hidden;
      position: relative;
      padding: 28px;
      color: inherit;
      text-decoration: none;
      border: 1px solid #344539;
      border-top: 3px solid var(--accent);
      border-radius: 20px;
      background: radial-gradient(circle at 100% 0%, var(--glow), transparent 65%), #131b17;
      transition: border-color .18s, transform .18s;
    }
    .card.mint { --accent: #66dec1; --glow: #193c33; }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .identity { margin-bottom: 30px; }
    h2 { min-width: 0; margin: 0; font-size: clamp(20px, 2.4vw, 25px); letter-spacing: -.6px; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
    dt { color: var(--muted); font-size: 11px; }
    dd { margin: 4px 0 0; font-size: 25px; font-weight: 650; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
    .open { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 0; padding-top: 18px; border-top: 1px solid #ffffff16; color: var(--accent); font-size: 13px; font-weight: 600; }
    .arrow { font-size: 22px; font-weight: 400; line-height: 1; }
    @media (max-width: 700px) {
      main { padding: 40px 20px; }
      .profiles { grid-template-columns: 1fr; gap: 16px; }
      .card { padding: 24px; }
      .identity { margin-bottom: 24px; }
      dd { font-size: 23px; }
    }
    @media (max-width: 380px) {
      main { padding-inline: 16px; }
      .card { padding: 20px; }
      dl { gap: 8px; }
      dd { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Games over the years</p>
      <h1>Xbox Playback</h1>
      <p class="intro">Choose a gamertag to explore.</p>
    </header>
    <nav class="profiles" aria-label="Gamertag histories">
      <a class="card" href="./papasnewbag/" aria-labelledby="papasnewbag-name">
        <div class="identity">
          <h2 id="papasnewbag-name">papasnewbag</h2>
        </div>
        <dl>
          <div><dt>Titles</dt><dd>614</dd></div>
          <div><dt>Hours</dt><dd>5,439</dd></div>
          <div><dt>Gamerscore</dt><dd>150,852</dd></div>
        </dl>
        <p class="open">View history <span class="arrow" aria-hidden="true">&rarr;</span></p>
      </a>
      <a class="card mint" href="./cheetahpuppygrl/" aria-labelledby="cheetahpuppygrl-name">
        <div class="identity">
          <h2 id="cheetahpuppygrl-name">CheetahPuppyGrl</h2>
        </div>
        <dl>
          <div><dt>Titles</dt><dd>112</dd></div>
          <div><dt>Hours</dt><dd>1,263</dd></div>
          <div><dt>Gamerscore</dt><dd>14,770</dd></div>
        </dl>
        <p class="open">View history <span class="arrow" aria-hidden="true">&rarr;</span></p>
      </a>
    </nav>
  </main>
</body>
</html>
